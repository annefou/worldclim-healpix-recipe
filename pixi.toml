[workspace]
name = "worldclim-healpix-recipe"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
rasterio = ">=1.4"
healpix-geo = ">=0.4.1"

[pypi-dependencies]
worldclim-healpix-recipe = { path = ".", editable = true }
# healpix-convert main at the commit the recipe was tested with (pyramids, override_attrs)
healpix-convert = { git = "https://github.com/GRID4EARTH/healpix-convert.git", rev = "dfa4ed3" }
# shared building blocks of the recipes (staging, settings, BIOCLIM conventions)
healpix-recipe-tools = { git = "https://github.com/annefou/healpix-recipe-tools.git", rev = "5baf58a" }
healpix-resample = ">=2026.10.2"
# the CPU wheel is enough; the CUDA one does not fit on a normal working disk
torch = { version = ">=2.9.1", index = "https://download.pytorch.org/whl/cpu" }

[feature.test.dependencies]
pytest = ">=8"

[feature.test.tasks]
test = "pytest -q"
test-network = "pytest -q -m network"

[environments]
test = ["test"]
