[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldclim-healpix-recipe"
version = "0.1.0.dev0"
description = "WorldClim 2.1 bioclimatic variables on HEALPix (WGS84, NESTED): a healpix-convert recipe"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Anne Fouilloux", email = "anne.fouilloux@lifewatch.eu" }]
dependencies = ["healpix-convert", "healpix-recipe-tools", "rasterio>=1.4", "shapely>=2.1", "xarray>=2025.11", "zarr>=3.1.3"]

[project.urls]
Repository = "https://github.com/annefou/worldclim-healpix-recipe"
Discussion = "https://github.com/GRID4EARTH/healpix-convert/issues/18"

[tool.hatch.build.targets.wheel]
packages = ["src/worldclim_healpix_recipe"]

[tool.pytest.ini_options]
markers = ["network: reads CHELSA over the internet (run with -m network)"]
addopts = "-m 'not network'"
